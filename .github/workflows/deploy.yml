name: deploy
on:
  workflow_dispatch:  # 👈 允许手动触发
  schedule:
    - cron:  '0 22 * * *'  # 早上6点执行

jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: SecretId
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run deploy
        env: 
          ALIST_SPACE_KEY: ${{ secrets.ALIST_SPACE_KEY }}
          SECRET_ID: ${{ secrets.SECRET_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}