name: Keep Workspace Alive with SSH

on:
  workflow_dispatch:
  # schedule:
    # - cron: '*/9 * * * *'
    # - cron: '*/9 4-16 * * *' # 12:00-00:00 每9分钟运行一次

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 350 
    environment: SecretId
    permissions:
      contents: read
      actions: write
    steps:
      - name: keep-alive
        id: ssh-keep-alive
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_URL }} "
            echo '=== Keep-alive ping at $(date) ===';
            
            # 检查 5244 端口是否被使用
            PORT_CHECK=\$(lsof -i :5244 2>/dev/null || ss -tuln | grep :5244 || netstat -tuln 2>/dev/null | grep :5244);
            
            if [ -z \"\$PORT_CHECK\" ]; then
              echo 'Port 5244 is not in use, starting alist...';
              cd /workspace/programming-language-demo
              pnpm alist;
            else
              echo 'Port 5244 is already in use, skipping alist start.';
              echo \"Port status: \$PORT_CHECK\";
            fi
          "
      - name: Trigger deploy on SSH failure
        if: steps.ssh-keep-alive.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('SSH connection failed, triggering deploy.yml workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: context.ref || 'main'
            });
            console.log('Deploy workflow triggered successfully');
